<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test3, unidad1</title>
  <style>
    body { margin: 0; background: #eef7f5; color: #172554; font-family: system-ui, sans-serif; }
    #loading { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
    #loading strong { display: block; font-size: 1.2rem; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main id="loading"><div><strong>Preparando Test3, unidad1…</strong><span>Se están seleccionando las tarjetas.</span></div></main>
  <script>
  (() => {
    // La referencia visual para el reverso, la respuesta y su cuenta atrás
    // es esc-tu. La baraja se sustituye después por las tarjetas de Gramática U1.
    const TEMPLATE_FILE = 'esc-tu.html';
    const PROGRESS_KEY = 'esc-gr-u1-mixta_gameProgress';
    const DRAW_KEY = 'esc-gr-u1-mixta-draw';
    const CARD_COUNT_PER_TOPIC = 3;
    const SOURCES = [
      'apellidarse', 'dedicarse', 'determinados', 'estar', 'estudiar',
      'hablar', 'hacer', 'indeterminantes', 'llamarse', 'posesivos1',
      'ser', 'tener', 'trabajar', 'vivir'
    ];

    const escapeScript = (source) => source.replace(/<\/script/gi, '<\\/script');
    const shuffle = (items) => {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
      }
      return copy;
    };

    const readAudioFiles = (sourceDocument) => {
      const scriptText = Array.from(sourceDocument.querySelectorAll('script'))
        .map((script) => script.textContent || '')
        .find((text) => /const\s+audioFiles\s*=/.test(text)) || '';
      const declaration = scriptText.match(/const\s+audioFiles\s*=\s*\[([\s\S]*?)\];/);
      return declaration
        ? Array.from(declaration[1].matchAll(/['"]([^'"]+\.(?:wav|mp3))['"]/gi), (match) => match[1])
        : [];
    };

    const createDeckScript = () => escapeScript(`
      (() => {
        const sources = ${JSON.stringify(SOURCES)};
        const takePerSource = ${CARD_COUNT_PER_TOPIC};
        const progressKey = ${JSON.stringify(PROGRESS_KEY)};
        const drawKey = ${JSON.stringify(DRAW_KEY)};
        const container = document.currentScript.parentElement;
        const shuffle = ${shuffle.toString()};
        const isResumableProgress = () => {
          try {
            const state = JSON.parse(localStorage.getItem(progressKey) || 'null');
            if (!state || state.contentVersion !== 'esc-gr-u1-mixta-v1') return false;
            const completed = Array.isArray(state.completedCards) ? state.completedCards.length : 0;
            const total = sources.length * takePerSource;
            return completed < total && (completed > 0 || Number(state.correctCount || 0) > 0 || Number(state.incorrectCount || 0) > 0 || Number(state.voiceAttempts || 0) > 0 || Number(state.currentCardIndex || 0) > 0);
          } catch (_) { return false; }
        };
        const getSavedDraw = () => {
          if (!isResumableProgress()) return null;
          try {
            const draw = JSON.parse(localStorage.getItem(drawKey) || 'null');
            return Array.isArray(draw) && draw.length === sources.length * takePerSource ? draw : null;
          } catch (_) { return null; }
        };
        const savedDraw = getSavedDraw();
        const selectedBySource = new Map((savedDraw || []).map((entry) => [entry.source, entry.indices]));
        const deck = [];
        const sourceDocuments = new Map();
        const infinitiveBySource = {
          apellidarse: 'apellidarse', dedicarse: 'dedicarse', estar: 'estar',
          estudiar: 'estudiar', hablar: 'hablar', hacer: 'hacer',
          llamarse: 'llamarse', ser: 'ser', tener: 'tener',
          trabajar: 'trabajar', vivir: 'vivir'
        };
        const scopeSourceFrontCss = (sourceDocument, source) => {
          const styleId = 'esc-gr-u1-mixta-source-front-' + source;
          if (document.getElementById(styleId)) return;
          // Misma estrategia probada de com-gr-u1-mixta: se importan las
          // declaraciones originales con mayor especificidad, sin copiar la
          // geometría 3D de cada archivo de origen.
          // cardId se guarda y se restaura con la partida. data-source no: al
          // reanudar puede pertenecer a la posición anterior de la baraja.
          const root = '#flashcard-container .flashcard[data-card-id*="-' + source + '-"]';
          const scopeSelector = (selector) => {
            const value = selector.trim();
            if (/\\.(?:back|card-back|flashcard|results-card)\\b/.test(value)) return '';
            // Solo pueden entrar reglas del frontal. Los selectores globales
            // de respuesta y countdown de los temas deben seguir siendo los
            // de esc-tu.
            if (!/\\.(?:front(?:\\b|-)|article-front-card\\b|article-options-column\\b|article-option\\b|article-noun-column\\b)/.test(value)) return '';
            if (value.startsWith('#flashcard-container')) {
              const suffix = value.slice('#flashcard-container'.length);
              return /\\.front\\b/.test(suffix) ? root + suffix : '';
            }
            return root + ' ' + value;
          };
          const scopeRules = (rules) => Array.from(rules || []).map((rule) => {
            if (rule.type === CSSRule.STYLE_RULE) {
              const selectors = rule.selectorText.split(',').map(scopeSelector).filter(Boolean);
              return selectors.length ? selectors.join(', ') + ' { ' + rule.style.cssText + ' }' : '';
            }
            // Evitar que @keyframes globales de los temas sobrescriban
            // respuestaGlow, fadeInOut o pulse de esc-tu.
            if (rule.type === CSSRule.KEYFRAMES_RULE) return '';
            if (rule.cssRules && rule.cssRules.length) {
              const header = rule.cssText.slice(0, rule.cssText.indexOf('{')).trim();
              const nested = scopeRules(rule.cssRules);
              return nested.trim() ? header + ' { ' + nested + ' }' : '';
            }
            return rule.type === CSSRule.FONT_FACE_RULE ? rule.cssText : '';
          }).join('\\n');
          const css = Array.from(sourceDocument.styleSheets)
            .map((sheet) => { try { return scopeRules(sheet.cssRules); } catch (_) { return ''; } })
            .join('\\n');
          if (!css.trim()) return;
          const style = document.createElement('style');
          style.id = styleId;
          style.textContent = css;
          document.head.appendChild(style);
        };
        sources.forEach((source) => {
          try {
            const request = new XMLHttpRequest();
            request.open('GET', 'esc-' + source + '.html', false);
            request.send(null);
            if (request.status && (request.status < 200 || request.status >= 300)) return;
            const sourceDocument = new DOMParser().parseFromString(request.responseText, 'text/html');
            sourceDocuments.set(source, sourceDocument);
            const audioFiles = (${readAudioFiles.toString()})(sourceDocument);
            const cards = Array.from(sourceDocument.querySelectorAll('#flashcard-container > .flashcard'));
            let indices = selectedBySource.get(source);
            if (!Array.isArray(indices) || indices.length !== takePerSource || indices.some((index) => !Number.isInteger(index) || index < 0 || index >= cards.length)) {
              indices = shuffle(cards.map((_, index) => index)).slice(0, takePerSource);
            }
            indices.forEach((sourceIndex) => {
              const card = cards[sourceIndex].cloneNode(true);
              card.classList.remove('flipped', 'is-visible', 'completed');
              card.dataset.source = source;
              card.dataset.sourceIndex = String(sourceIndex);
              card.dataset.cardId = 'esc-gr-u1-mixta-' + source + '-' + (sourceIndex + 1);
              let sourceAudioFile = audioFiles[sourceIndex] || card.dataset.audioFile || '';
              // En el repositorio, indeterminantes-2 a -20 fueron publicados
              // con doble punto antes de wav (p. ej. -13..wav).
              if (source === 'indeterminantes' && sourceIndex > 0) {
                sourceAudioFile = sourceAudioFile.replace(/\\.+wav$/i, '..wav');
              }
              card.dataset.audioFile = sourceAudioFile;
              // Las tarjetas de origen guardan la solución en la cara trasera,
              // no siempre en data-answer. La plantilla de escritura necesita
              // este atributo para mostrar y validar la respuesta.
              card.dataset.answer = String(card.dataset.answer || card.querySelector('.back')?.textContent || '')
                .replace(/\\s+/g, ' ')
                .trim();
              const front = card.querySelector('.front');
              const infinitive = infinitiveBySource[source];
              const pronoun = front?.querySelector('.front-pronoun');
              if (!infinitive && front) {
                front.querySelectorAll('.front-infinitive').forEach((label) => label.remove());
              }
              if (infinitive && pronoun && !front.querySelector('.front-infinitive')) {
                const infinitiveLabel = document.createElement('span');
                infinitiveLabel.className = 'front-infinitive';
                infinitiveLabel.textContent = infinitive;
                pronoun.insertAdjacentElement('afterend', infinitiveLabel);
              }
              if (front && !front.querySelector('.esc-source-' + source)) {
                const sourceMarker = document.createElement('div');
                sourceMarker.className = 'esc-source-front esc-source-' + source;
                while (front.firstChild) sourceMarker.appendChild(front.firstChild);
                front.appendChild(sourceMarker);
              }
              deck.push(card);
            });
            selectedBySource.set(source, indices);
          } catch (error) {
            console.warn('No se pudieron cargar las tarjetas de esc-' + source + '.', error);
          }
        });
        if (!savedDraw) {
          try {
            localStorage.setItem(drawKey, JSON.stringify(sources.map((source) => ({ source, indices: selectedBySource.get(source) || [] }))));
          } catch (_) {}
        }
        container.replaceChildren(...shuffle(deck));
        // La plantilla de escritura usa este catálogo para barajar y restaurar
        // las caras sin perder el contenido original de cada tema.
        window.MAS_CANONICAL_CARDS = deck.map((card, contentIndex) => ({
          cardId: String(card.dataset.cardId || ''),
          answer: String(card.dataset.answer || ''),
          targetForm: String(card.dataset.targetForm || ''),
          targetPosition: String(card.dataset.targetPosition || ''),
          frontHTML: card.querySelector('.front')?.innerHTML || '',
          backHTML: card.querySelector('.back')?.innerHTML || '',
          contentIndex: String(contentIndex),
          audioFile: String(card.dataset.audioFile || '')
        }));
        window.getMasCanonicalCardData = (value, fallbackAnswer = '') => {
          const isNode = value && value.nodeType === 1;
          const cardId = String(isNode ? value.dataset.cardId || '' : value?.cardId || value || '');
          const answer = String(isNode ? value.dataset.answer || '' : value?.backText || value?.answer || fallbackAnswer || '');
          return window.MAS_CANONICAL_CARDS.find((item) => item.cardId === cardId)
            || window.MAS_CANONICAL_CARDS.find((item) => item.answer === answer)
            || null;
        };
        // esc-tu crea este mapa dentro de su generador de tarjetas. Como aquí
        // sustituimos ese generador por la baraja mixta, debemos reconstruirlo:
        // renderPersonalAnswerWithSplit lo usa para aplicar exactamente
        // .personal-verb-highlight y la animación visual de esc-tu.
        window.TU_VERB_FORMS = {};
        window.ESC_GR_U1_MIXTA_ANSWER_SPLITS = {};
        const endingsByFamily = {
          ar: ['o', 'as', 'a', 'a', 'a', 'amos', 'amos', 'áis', 'áis', 'an', 'an', 'an'],
          er: ['o', 'es', 'e', 'e', 'e', 'emos', 'emos', 'éis', 'éis', 'en', 'en', 'en'],
          ir: ['o', 'es', 'e', 'e', 'e', 'imos', 'imos', 'ís', 'ís', 'en', 'en', 'en']
        };
        const verbFamily = {
          apellidarse: 'ar', dedicarse: 'ar', estar: 'ar', estudiar: 'ar',
          hablar: 'ar', llamarse: 'ar', trabajar: 'ar',
          hacer: 'er', ser: 'er', tener: 'er', vivir: 'ir'
        };
        const specialEndings = {
          estar: ['oy', 'ás', 'á', 'á', 'á', 'amos', 'amos', 'áis', 'áis', 'án', 'án', 'án'],
          ser: ['oy', 'es', 's', 's', 's', 'omos', 'omos', 'ois', 'ois', 'on', 'on', 'on']
        };
        deck.forEach((card) => {
          const answer = String(card.dataset.answer || '').trim();
          if (!answer) return;
          const source = String(card.dataset.source || '');
          const sourceIndex = Number(card.dataset.sourceIndex || 0);
          const isArticleOrPossessive = ['determinados', 'indeterminantes', 'posesivos1'].includes(source);
          const isUnhighlightedIrregular = ['ser', 'estar'].includes(source);
          let highlightedPart = '';
          if (isArticleOrPossessive) {
            highlightedPart = answer.split(/\\s+/)[0];
          } else if (isUnhighlightedIrregular) {
            highlightedPart = '';
          } else {
            const family = verbFamily[source];
            const expectedEnding = (specialEndings[source] || endingsByFamily[family] || [])[sourceIndex] || '';
            highlightedPart = expectedEnding && answer.toLocaleLowerCase('es').endsWith(expectedEnding.toLocaleLowerCase('es'))
              ? answer.slice(answer.length - expectedEnding.length)
              : answer.slice(-1);
          }
          const highlightAt = highlightedPart
            ? answer.toLocaleLowerCase('es').lastIndexOf(highlightedPart.toLocaleLowerCase('es'))
            : -1;
          const split = isUnhighlightedIrregular
            ? { before: answer, highlight: '', after: '' }
            : highlightAt >= 0
            ? {
                before: answer.slice(0, highlightAt),
                highlight: answer.slice(highlightAt, highlightAt + highlightedPart.length),
                after: answer.slice(highlightAt + highlightedPart.length)
              }
            : { before: '', highlight: answer, after: '' };
          window.ESC_GR_U1_MIXTA_ANSWER_SPLITS[answer] = split;
          window.ESC_GR_U1_MIXTA_ANSWER_SPLITS[answer.replace(/[.。]\\s*$/, '')] = split;
          window.TU_VERB_FORMS[answer] = highlightedPart;
          window.TU_VERB_FORMS[answer.replace(/[.。]\\s*$/, '')] = highlightedPart;
        });
        window.ESC_GR_U1_MIXTA_CARD_COUNT = deck.length;
        const installOriginalFrontStyles = () => {
          sourceDocuments.forEach((sourceDocument, source) => scopeSourceFrontCss(sourceDocument, source));
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', installOriginalFrontStyles, { once: true });
        } else {
          installOriginalFrontStyles();
        }
      })();
    `);

    try {
      const request = new XMLHttpRequest();
      request.open('GET', TEMPLATE_FILE, false);
      request.send(null);
      if (request.status && (request.status < 200 || request.status >= 300)) throw new Error('No se pudo leer la plantilla');

      const sourceDocument = new DOMParser().parseFromString(request.responseText, 'text/html');
      sourceDocument.title = 'Test3, unidad1';
      const title = sourceDocument.querySelector('.cuesta-title-text');
      if (title) title.textContent = 'TEST 3, UNIDAD 1';
      // esc-tu contiene varios <style> dentro de #flashcard-container. Al
      // sustituir la baraja, innerHTML también los eliminaba; entre ellos
      // estaba loslunes-shared-front-styles, que define respuestaGlow y el
      // resaltado azul de la respuesta. Se conservan intactos en <head>
      // antes de reemplazar únicamente las tarjetas.
      const templateContainer = sourceDocument.getElementById('flashcard-container');
      if (templateContainer) {
        Array.from(templateContainer.querySelectorAll('style')).forEach((style) => {
          sourceDocument.head.appendChild(style);
        });
      }
      const cardBuilder = sourceDocument.getElementById('loslunes-shared-front-content');
      if (cardBuilder) cardBuilder.remove();
      const container = sourceDocument.getElementById('flashcard-container');
      if (!container) throw new Error('No se encontró el tablero de tarjetas');
      const mixedStatsBox = sourceDocument.getElementById('stats-box');
      if (mixedStatsBox) {
        // sel-hablar inicia el cuadro visible para presentar primero los
        // indicadores de avance; showPillHints se encarga de ocultarlo luego.
        mixedStatsBox.classList.remove('hidden');
        mixedStatsBox.remove();
      }
      container.innerHTML = '<script id="esc-gr-u1-mixta-card-loader">' + createDeckScript() + '<\/script>';
      if (mixedStatsBox) container.appendChild(mixedStatsBox);

      const freshDeckScript = sourceDocument.createElement('script');
      freshDeckScript.id = 'esc-gr-u1-mixta-fresh-deck';
      freshDeckScript.textContent = `
        (() => {
          window.addEventListener('error', (event) => {
            console.error('esc-gr-u1-mixta:', event.error || event.message);
          });
          // Esta baraja solo usa la instrucción oral del reverso.
          window.playIntroAudio = () => {};
          // Prepararla al cargar evita empezar la descarga en el primer volteo.
          escribeAudio = new Audio('https://fawzinoo.github.io/audios/escribe.wav');
          escribeAudio.preload = 'auto';
          escribeAudio.load();
          // Reproducir la instrucción completa desde el principio.
          window.playEscribeAudioOnce = () => {
            if (hasPlayedEscribeAudio) return;
            hasPlayedEscribeAudio = true;
            escribeAudio.currentTime = 0;
            escribeAudio.play().catch((error) => {
              hasPlayedEscribeAudio = false;
              console.warn('No se pudo reproducir escribe.wav:', error);
            });
          };
          const mixedInfinitives = {
            apellidarse: 'apellidarse', dedicarse: 'dedicarse', estar: 'estar',
            estudiar: 'estudiar', hablar: 'hablar', hacer: 'hacer',
            llamarse: 'llamarse', ser: 'ser', tener: 'tener',
            trabajar: 'trabajar', vivir: 'vivir'
          };
          const restoreSourceMarkers = () => {
            document.querySelectorAll('#flashcard-container > .flashcard').forEach((card) => {
              const front = card.querySelector(':scope > .front');
              const existingMarker = front && front.querySelector('[class*="esc-source-"]');
              const markerSourceClass = existingMarker
                ? Array.from(existingMarker.classList)
                  .find((className) => className.startsWith('esc-source-') && className !== 'esc-source-front')
                : '';
              const markerSource = markerSourceClass ? markerSourceClass.slice('esc-source-'.length) : '';
              const cardIdSourceMatch = String(card.dataset.cardId || '')
                .match(/esc-gr-u1-mixta-([a-z0-9]+)-\\d+$/);
              // El contenido del front es la autoridad. Tras barajar o
              // restaurar, data-source puede pertenecer a la antigua posición.
              const source = markerSource
                || (cardIdSourceMatch && cardIdSourceMatch[1])
                || card.dataset.source;
              if (!source || !front) return;
              card.dataset.source = source;
              const infinitive = mixedInfinitives[source];
              if (infinitive) {
                card.querySelectorAll('.back .writing-question-instruction')
                  .forEach((instruction) => instruction.remove());
              }
              const pronoun = front.querySelector('.front-pronoun');
              if (!infinitive) {
                front.querySelectorAll('.front-infinitive').forEach((label) => label.remove());
              }
              if (infinitive && pronoun && !front.querySelector('.front-infinitive')) {
                const infinitiveLabel = document.createElement('span');
                infinitiveLabel.className = 'front-infinitive';
                infinitiveLabel.textContent = infinitive;
                pronoun.insertAdjacentElement('afterend', infinitiveLabel);
              }
              if (front.querySelector('.esc-source-' + source)) return;
              const marker = document.createElement('div');
              marker.className = 'esc-source-front esc-source-' + source;
              while (front.firstChild) marker.appendChild(front.firstChild);
              front.appendChild(marker);
            });
          };
          // En una partida reanudada, la plantilla restaura front.innerHTML y
          // no conserva data-source. Recuperamos la marca desde el cardId.
          document.addEventListener('DOMContentLoaded', () => {
            restoreSourceMarkers();
            const container = document.getElementById('flashcard-container');
            if (container) {
              new MutationObserver(restoreSourceMarkers)
                .observe(container, { childList: true, subtree: true });
            }
          }, { once: true });
          // Estos tres frentes usan la composición compacta del mixto de
          // gramática: opciones en una fila y el sustantivo debajo. Se aplica
          // después de la plantilla para conservar exactamente esa jerarquía.
          const articleFrontStyle = document.createElement('style');
          articleFrontStyle.id = 'esc-gr-u1-mixta-article-front-layout';
          articleFrontStyle.textContent = '.esc-source-front { display:contents!important; }';
          // Se conserva el bloque anterior solo como referencia temporal, pero
          // no se ejecuta: alteraba el CSS auténtico de los archivos esc-.
          if (false) { articleFrontStyle.textContent = [
            '.esc-source-front { display:contents!important; }',
            /* Las reglas están acotadas a cada tema para que ninguna regla global
               de esc-mixta pueda alterar la composición original. */
            '#flashcard-container .esc-source-posesivos1 .front-pronoun { font-family:Poppins,sans-serif!important; font-weight:800!important; font-size:clamp(1.4rem,4.5vw,2.2rem)!important; color:#38bdf8!important; letter-spacing:2px!important; text-shadow:0 0 30px rgba(56,189,248,.4),0 4px 15px rgba(0,0,0,.4)!important; z-index:2!important; position:relative!important; line-height:1!important; max-width:90%!important; text-align:center!important; word-break:keep-all!important; overflow-wrap:normal!important; margin-bottom:15px!important; text-transform:none!important; white-space:normal!important; }',
            '#flashcard-container .esc-source-posesivos1 .front-pronoun .pronoun-de { color:#fff!important; font-weight:600!important; margin-right:4px!important; text-transform:lowercase!important; }',
            '#flashcard-container .esc-source-posesivos1 .front-pronoun.short { font-size:clamp(3.8rem,13vw,6rem)!important; }',
            '#flashcard-container > .flashcard[data-source="determinados"] .article-front-card, #flashcard-container > .flashcard[data-source="indeterminantes"] .article-front-card, #flashcard-container > .flashcard[data-source="posesivos1"] .article-front-card { width:min(72%,360px)!important; min-height:auto!important; display:flex!important; flex-direction:column!important; align-items:center!important; justify-content:center!important; gap:clamp(9px,1.7vw,13px)!important; position:relative!important; z-index:2!important; padding:clamp(10px,1.8vw,14px)!important; border-radius:18px!important; background:rgba(255,255,255,.09)!important; border:1px solid rgba(255,255,255,.16)!important; box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 16px 34px rgba(0,0,0,.2)!important; backdrop-filter:blur(5px)!important; -webkit-backdrop-filter:blur(5px)!important; }',
            '#flashcard-container > .flashcard[data-source="determinados"] .article-front-card::before, #flashcard-container > .flashcard[data-source="indeterminantes"] .article-front-card::before, #flashcard-container > .flashcard[data-source="posesivos1"] .article-front-card::before { content:none!important; }',
            '#flashcard-container > .flashcard[data-source="determinados"] .article-options-column, #flashcard-container > .flashcard[data-source="indeterminantes"] .article-options-column, #flashcard-container > .flashcard[data-source="posesivos1"] .article-options-column { order:1!important; width:min(100%,300px)!important; display:grid!important; gap:5px!important; padding:5px!important; border-radius:15px!important; background:transparent!important; border:0!important; box-shadow:none!important; align-self:center!important; align-content:center!important; justify-items:stretch!important; }',
            '#flashcard-container > .flashcard[data-source="determinados"] .article-options-column, #flashcard-container > .flashcard[data-source="indeterminantes"] .article-options-column { grid-template-columns:repeat(4,minmax(0,1fr))!important; }',
            '#flashcard-container > .flashcard[data-source="posesivos1"] .article-options-column { grid-template-columns:repeat(3,minmax(0,1fr))!important; }',
            '#flashcard-container > .flashcard[data-source="determinados"] .article-option, #flashcard-container > .flashcard[data-source="indeterminantes"] .article-option, #flashcard-container > .flashcard[data-source="posesivos1"] .article-option { display:flex!important; align-items:center!important; justify-content:center!important; min-height:30px!important; padding:4px 5px!important; border-radius:10px!important; font-family:Poppins,sans-serif!important; font-weight:800!important; font-size:clamp(.72rem,1.35vw,.84rem)!important; color:#ffd54a!important; background:rgba(255,213,74,.12)!important; border:1px solid rgba(255,213,74,.28)!important; text-shadow:0 2px 8px rgba(0,0,0,.26)!important; text-transform:lowercase!important; letter-spacing:0!important; box-shadow:none!important; }',
            '#flashcard-container > .flashcard[data-source="determinados"] .article-noun-column, #flashcard-container > .flashcard[data-source="indeterminantes"] .article-noun-column, #flashcard-container > .flashcard[data-source="posesivos1"] .article-noun-column { order:2!important; max-width:100%!important; min-width:0!important; font-family:Poppins,sans-serif!important; font-weight:900!important; font-size:clamp(1.55rem,3.5vw,2.45rem)!important; color:#fff!important; line-height:.95!important; text-align:center!important; letter-spacing:0!important; text-transform:lowercase!important; white-space:normal!important; overflow-wrap:normal!important; word-break:normal!important; hyphens:none!important; text-shadow:0 0 42px rgba(34,211,238,.36),0 10px 28px rgba(0,0,0,.46)!important; }',
            '@media (max-width:620px) { #flashcard-container > .flashcard[data-source="determinados"] .article-front-card, #flashcard-container > .flashcard[data-source="indeterminantes"] .article-front-card, #flashcard-container > .flashcard[data-source="posesivos1"] .article-front-card { width:min(82%,285px)!important; gap:6px!important; padding:10px!important; } #flashcard-container > .flashcard[data-source="determinados"] .article-noun-column, #flashcard-container > .flashcard[data-source="indeterminantes"] .article-noun-column, #flashcard-container > .flashcard[data-source="posesivos1"] .article-noun-column { font-size:clamp(1.38rem,6.4vw,2rem)!important; } #flashcard-container > .flashcard[data-source="determinados"] .article-options-column, #flashcard-container > .flashcard[data-source="indeterminantes"] .article-options-column, #flashcard-container > .flashcard[data-source="posesivos1"] .article-options-column { width:min(100%,250px)!important; gap:5px!important; padding:5px!important; border-radius:13px!important; } #flashcard-container > .flashcard[data-source="determinados"] .article-option, #flashcard-container > .flashcard[data-source="indeterminantes"] .article-option, #flashcard-container > .flashcard[data-source="posesivos1"] .article-option { min-height:28px!important; font-size:clamp(.66rem,2.9vw,.78rem)!important; border-radius:9px!important; } }',
            '@media (max-width:360px) { #flashcard-container > .flashcard[data-source="posesivos1"] .article-options-column { grid-template-columns:repeat(2,minmax(0,1fr))!important; width:min(100%,220px)!important; } }'
          ].join('\\n'); }
          document.head.appendChild(articleFrontStyle);
          const infinitiveStyle = document.createElement('style');
          infinitiveStyle.id = 'esc-gr-u1-mixta-front-infinitives';
          infinitiveStyle.textContent = [
            '#flashcard-container .flashcard[data-source="apellidarse"] .front-infinitive,',
            '#flashcard-container .flashcard[data-source="dedicarse"] .front-infinitive,',
            '#flashcard-container .flashcard[data-source="estar"] .front-infinitive,',
            '#flashcard-container .flashcard[data-source="estudiar"] .front-infinitive,',
            '#flashcard-container .flashcard[data-source="hablar"] .front-infinitive,',
            '#flashcard-container .flashcard[data-source="hacer"] .front-infinitive,',
            '#flashcard-container .flashcard[data-source="llamarse"] .front-infinitive,',
            '#flashcard-container .flashcard[data-source="ser"] .front-infinitive,',
            '#flashcard-container .flashcard[data-source="tener"] .front-infinitive,',
            '#flashcard-container .flashcard[data-source="trabajar"] .front-infinitive,',
            '#flashcard-container .flashcard[data-source="vivir"] .front-infinitive{display:block!important;margin-top:6px!important;color:#facc15!important;font-family:"Poppins",sans-serif!important;font-size:clamp(1.6rem,5vw,2.2rem)!important;font-weight:800!important;line-height:1.1!important;letter-spacing:.08em!important;text-transform:lowercase!important;text-shadow:0 3px 10px rgba(0,0,0,.38)!important;}',
            '#flashcard-container .flashcard .front-infinitive::before{content:"";display:block;width:min(34%,160px);height:2px;margin:0 auto 10px;border-radius:999px;background:rgba(250,204,21,.72);box-shadow:0 1px 6px rgba(250,204,21,.28);}',
            '#flashcard-container .flashcard[data-source="ser"] .front-infinitive,#flashcard-container .flashcard[data-source="estar"] .front-infinitive{font-size:clamp(1.82rem,5.7vw,2.45rem)!important;}'
          ].join('\\n');
          document.head.appendChild(infinitiveStyle);
          // Compatibilidad mínima con la plantilla esc-mixta: esta añade a
          // todas las opciones un ancho «fit-content». Los originales no lo
          // tienen; por eso en la mixta las tres columnas quedaban encogidas.
          // Solo se anulan esas dos propiedades ajenas al CSS de origen.
          const originalFrontCompat = document.createElement('style');
          originalFrontCompat.id = 'esc-gr-u1-mixta-original-front-compat';
          originalFrontCompat.textContent = [
            '#flashcard-container .flashcard[data-card-id*="-posesivos1-"] .front-pronoun { font-family:Poppins,sans-serif!important; font-weight:800!important; font-size:clamp(1.4rem,4.5vw,2.2rem)!important; color:#38bdf8!important; letter-spacing:2px!important; text-shadow:0 0 30px rgba(56,189,248,.4),0 4px 15px rgba(0,0,0,.4)!important; z-index:2!important; position:relative!important; line-height:1!important; max-width:90%!important; text-align:center!important; word-break:keep-all!important; overflow-wrap:normal!important; margin-bottom:15px!important; text-transform:none!important; }',
            '#flashcard-container .flashcard[data-card-id*="-posesivos1-"] .front-pronoun .pronoun-de { color:#fff!important; font-weight:600!important; margin-right:4px!important; text-transform:lowercase!important; }',
            '#flashcard-container .flashcard[data-card-id*="-determinados-"] .article-option, #flashcard-container .flashcard[data-card-id*="-indeterminantes-"] .article-option, #flashcard-container .flashcard[data-card-id*="-posesivos1-"] .article-option { width:auto!important; margin:0!important; justify-self:stretch!important; }'
          ].join('\\n');
          document.head.appendChild(originalFrontCompat);
          // En la respuesta de la mixta se resalta solo la terminación verbal
          // (o el artículo/posesivo examinado) y toda la forma queda en una
          // única línea. La animación y el resto del aspecto siguen siendo los
          // originales de esc-tu.
          const answerSplitStyle = document.createElement('style');
          answerSplitStyle.id = 'esc-gr-u1-mixta-answer-split';
          answerSplitStyle.textContent = '.personal-revealed-answer .answer-line.esc-gr-u1-mixta-one-line-answer{display:inline-block!important;width:auto!important;max-width:96%!important;white-space:nowrap!important;overflow-wrap:normal!important;word-break:keep-all!important;flex-direction:row!important;align-items:baseline!important;}';
          document.head.appendChild(answerSplitStyle);
          const basePersonalAnswerRenderer = window.renderPersonalAnswerWithSplit;
          const escapeAnswerHTML = (value) => String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
          window.renderPersonalAnswerWithSplit = (raw, personalVerb) => {
            const clean = String(raw || '').replace(/\\s+([?.,!؛;:])/g, '$1').trim();
            const split = window.ESC_GR_U1_MIXTA_ANSWER_SPLITS
              && (window.ESC_GR_U1_MIXTA_ANSWER_SPLITS[clean]
                || window.ESC_GR_U1_MIXTA_ANSWER_SPLITS[clean.replace(/[.。]\\s*$/, '')]);
            if (!split) {
              return typeof basePersonalAnswerRenderer === 'function'
                ? basePersonalAnswerRenderer(raw, personalVerb)
                : escapeAnswerHTML(clean);
            }
            return '<span class="answer-line esc-gr-u1-mixta-one-line-answer">'
              + escapeAnswerHTML(split.before)
              + (split.highlight
                ? '<span class="personal-verb-highlight">' + escapeAnswerHTML(split.highlight) + '</span>'
                : '')
              + escapeAnswerHTML(split.after)
              + '</span>';
          };
          // La precarga original de esc-tu resuelve audios tu-*. En esta
          // baraja cada tarjeta procede de otro tema y ya lleva su archivo
          // exacto en data-audio-file; se prepara al quedar visible para que
          // la voz empiece sin esperar una nueva descarga tras responder.
          const prepareMixedCardAudio = (card) => {
            if (!card || !card.dataset || !card.dataset.audioFile) return;
            const src = 'https://fawzinoo.github.io/audios/' + card.dataset.audioFile;
            if (!card._audioEl) card._audioEl = new Audio();
            const audio = card._audioEl;
            audio.preload = 'auto';
            const resolvedSrc = new URL(src, document.baseURI).href;
            if (audio.src !== resolvedSrc) {
              audio.src = src;
              try { audio.load(); } catch (_) {}
            }
          };
          const prepareVisibleMixedAudio = () => {
            const visible = document.querySelector('#flashcard-container > .flashcard.is-visible')
              || Array.from(document.querySelectorAll('#flashcard-container > .flashcard'))
                .find((card) => getComputedStyle(card).display !== 'none');
            prepareMixedCardAudio(visible);
          };
          // error.mp3 se creaba desde cero en cada fallo. Se mantiene una
          // instancia precargada para que el aviso sonoro sea inmediato.
          const mixedErrorAudio = new Audio('https://fawzinoo.github.io/audios/error.mp3');
          mixedErrorAudio.preload = 'auto';
          mixedErrorAudio.volume = 0.5;
          try { mixedErrorAudio.load(); } catch (_) {}
          window.playErrorSound = () => {
            try {
              mixedErrorAudio.pause();
              mixedErrorAudio.currentTime = 0;
              mixedErrorAudio.play().catch(() => {});
            } catch (_) {}
          };
          document.addEventListener('DOMContentLoaded', () => {
            prepareVisibleMixedAudio();
            const mixedContainer = document.getElementById('flashcard-container');
            if (mixedContainer) {
              new MutationObserver(prepareVisibleMixedAudio).observe(mixedContainer, {
                subtree: true,
                childList: true,
                attributes: true,
                attributeFilter: ['class', 'style']
              });
            }
          }, { once: true });
          document.addEventListener('pointerdown', (event) => {
            if (event.target && event.target.closest('.check-button')) prepareVisibleMixedAudio();
          }, true);
          const directStartKey = 'esc-gr-u1-mixta-direct-start';
          const showInitialModal = window.showContinueGameModal;
          window.showContinueGameModal = (hasSavedProgress) => {
            const directStart = sessionStorage.getItem(directStartKey) === 'true';
            sessionStorage.removeItem(directStartKey);
            if (directStart && !hasSavedProgress) {
              resetEscribeAudioSession();
              initializePage();
              if (typeof window.playIntroAudio === 'function') window.playIntroAudio(true);
              return;
            }
            return showInitialModal(hasSavedProgress);
          };
          const startFreshDeck = (directStart = false) => {
            localStorage.removeItem('${PROGRESS_KEY}');
            localStorage.removeItem('${DRAW_KEY}');
            localStorage.removeItem('esc-gr-u1-mixta_shuffleCount');
            if (directStart === true) sessionStorage.setItem(directStartKey, 'true');
            window.location.reload();
          };
          // El botón del modal se intercepta antes de su listener original.
          document.addEventListener('click', (event) => {
            if (!event.target.closest('#start-fresh-btn')) return;
            event.preventDefault();
            event.stopImmediatePropagation();
            startFreshDeck(true);
          }, true);
          // El reinicio de la barra también debe generar otro sorteo.
          window.resetGame = startFreshDeck;
        })();
      `;
      sourceDocument.body.appendChild(freshDeckScript);

      let page = '<!doctype html>\n' + sourceDocument.documentElement.outerHTML;
      page = page.replace(/U\d+G\d+T([1-4])/g, (_, test) => 'U1G14T' + test);
      page = page.replace(/u1-tu_esc_gameProgress/g, PROGRESS_KEY)
        .replace(/u1-tu-esc-v1/g, 'esc-gr-u1-mixta-v1')
        .replace(/u1-tu-esc-unlock-v1/g, 'gr-u1-mixta-test-unlock-state-v2')
        .replace(/esc-mixta_gameProgress/g, PROGRESS_KEY)
        .replace(/esc-mixta-draw/g, DRAW_KEY)
        .replace(/esc-mixta-v1/g, 'esc-gr-u1-mixta-v1')
        .replace(/u1-tu_esc_shuffleCount/g, 'esc-gr-u1-mixta_shuffleCount')
        .replace(/u1_tu_esc_btn_sounds_muted/g, 'esc-gr-u1-mixta_btn_sounds_muted')
        .replace(/u1-tu_escDate/g, 'esc-gr-u1-mixtaDate')
        .replace(/u1-tu_esc/g, 'esc-gr-u1-mixta')
        .replace(/DATOS PERSONALES/g, 'TEST 3, UNIDAD 1')
        // playCardAudio de esc-tu reasigna siempre src y fuerza al navegador
        // a reiniciar la carga. En la mixta se conserva el audio ya precargado.
        .replace(
          /a\.src = src;\s*a\.currentTime = 0;/,
          `const resolvedCardAudioSrc = new URL(src, document.baseURI).href;
        if (a.src !== resolvedCardAudioSrc) {
            a.src = src;
            try { a.load(); } catch (_) {}
        }
        a.currentTime = 0;`
        )
        // La respuesta aparece primero y su locución comienza poco después.
        // El contador continúa esperando al final del audio.
        .replace(
          /stopAllAudios\(\);\s*playCardAudio\(card, \(\) => \{\s*answerAudioFinished = true;\s*maybeStartCountdown\(\);\s*\}\);/,
          `stopAllAudios();
                    setTimeout(() => {
                        playCardAudio(card, () => {
                            answerAudioFinished = true;
                            maybeStartCountdown();
                        });
                    }, 350);`
        );
      document.open();
      document.write(page);
      document.close();
      // El documento de carga pertenece al bootstrap y no a la plantilla final.
      document.getElementById('loading')?.remove();
    } catch (error) {
      document.getElementById('loading').innerHTML = '<div><strong>No se pudo cargar el ejercicio.</strong><span>Recarga la página e inténtalo de nuevo.</span></div>';
      console.error(error);
    }
  })();
  </script>
