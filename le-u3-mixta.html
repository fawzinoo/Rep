<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Léxico - Unidad 3 - Repaso Mixto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #4a5568, #2d3748);
            color: white;
            text-align: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-shrink: 0;
        }

        .header h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .stats-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 5px;
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat {
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .stat-value {
            color: #ffd700;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
            padding: 1px 20px 20px 20px;
            background: white;
        }

        .table-container::-webkit-scrollbar {
            width: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: #4a5568;
        }

        .alphabet-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .alphabet-table thead tr {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .alphabet-table th {
            padding: 20px;
            text-align: left;
            font-weight: 600;
            font-size: 1rem;
            border-bottom: 2px solid #667eea;
        }

        .alphabet-table td {
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        .alphabet-table tbody tr {
            transition: background-color 0.2s;
        }

        .alphabet-table tbody tr:hover {
            background-color: #f5f5f5;
        }

        .word-cell {
            font-weight: 600;
            color: #2d3748;
            font-size: 1.05rem;
        }

        .tema-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .play-button {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .play-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .play-button:active {
            transform: translateY(0);
        }

        .play-button i {
            font-size: 1rem;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .info-text {
            text-align: center;
            color: #6b7280;
            font-size: 0.95rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-book-open"></i> Léxico - Unidad 3</h1>
            <div class="stats-container">
                <div class="stat">
                    Total: <span class="stat-value" id="total-count">40</span>
                </div>
                <div class="stat">
                    Reproducidas: <span class="stat-value" id="played-count">0</span>
                </div>
                <div class="stat">
                    Progreso: <span class="stat-value" id="progress-percent">0%</span>
                </div>
            </div>
            <div class="control-buttons">
                <button class="btn btn-primary" onclick="playAll()">
                    <i class="fas fa-play"></i> Reproducir todas
                </button>
                <button class="btn btn-primary" onclick="pauseAll()">
                    <i class="fas fa-pause"></i> Pausar
                </button>
                <button class="btn btn-secondary" onclick="resetProgress()">
                    <i class="fas fa-redo"></i> Reiniciar
                </button>
            </div>
            <div class="info-text">Haz clic en cualquier palabra para escuchar la pronunciación</div>
        </div>

        <div class="table-container">
            <table class="alphabet-table">
                <thead>
                    <tr>
                        <th><i class="fas fa-list-ol"></i> Nº</th>
                        <th><i class="fas fa-tag"></i> Tema</th>
                        <th><i class="fas fa-language"></i> Palabra</th>
                        <th><i class="fas fa-volume-up"></i> Audio</th>
                    </tr>
                </thead>
                <tbody id="alphabet-tbody">
                    <!-- Las filas se generarán con JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const baseUrl = 'https://fawzinoo.github.io/audios/';
        const STORAGE_KEY = 'le-u3-mixta-progress';

        const cardData = [{"tema": "Material de Clase", "word": "El clip", "audio": "el clip.mp3"}, {"tema": "Material de Clase", "word": "El lápiz", "audio": "el lapiz.mp3"}, {"tema": "Material de Clase", "word": "El sacapuntas", "audio": "el sacapuntas.mp3"}, {"tema": "Material de Clase", "word": "La grapadora", "audio": "la grapadora.mp3"}, {"tema": "Material de Clase", "word": "La mesa", "audio": "La mesa.mp3"}, {"tema": "Los Muebles de mi habitación", "word": "La mantita", "audio": "la mantita.mp3"}, {"tema": "Los Muebles de mi habitación", "word": "El tocador", "audio": "el tocador.mp3"}, {"tema": "Los Muebles de mi habitación", "word": "La alfombra", "audio": "la alfombra.mp3"}, {"tema": "Los Muebles de mi habitación", "word": "La lámpara de araña", "audio": "la lampara de araña.mp3"}, {"tema": "Los Muebles de mi habitación", "word": "Las sábanas", "audio": "las sabanas.mp3"}, {"tema": "Cuarto de baño", "word": "El champú", "audio": "el champu.mp3"}, {"tema": "Cuarto de baño", "word": "El peine", "audio": "el peine.mp3"}, {"tema": "Cuarto de baño", "word": "La toalla", "audio": "la toalla.mp3"}, {"tema": "Cuarto de baño", "word": "La ducha", "audio": "la ducha.mp3"}, {"tema": "Cuarto de baño", "word": "El cepillo de dientes", "audio": "el cepillo de dientes.mp3"}, {"tema": "Objetos de cocina", "word": "La barra", "audio": "la barra .mp3"}, {"tema": "Objetos de cocina", "word": "La cocina de gas", "audio": "La cocina de gas.mp3"}, {"tema": "Objetos de cocina", "word": "El lavavajillas", "audio": "el lavavajillas.mp3"}, {"tema": "Objetos de cocina", "word": "La tostadora", "audio": "la tostadora.mp3"}, {"tema": "Objetos de cocina", "word": "La cacerola", "audio": "la cacerola .mp3"}, {"tema": "La ciudad", "word": "Grande", "audio": "grande.mp3"}, {"tema": "La ciudad", "word": "Antigua", "audio": "antigua.mp3"}, {"tema": "La ciudad", "word": "Interior", "audio": "interior.mp3"}, {"tema": "La ciudad", "word": "Pintoresca", "audio": "pintoresca.mp3"}, {"tema": "La ciudad", "word": "Divertida", "audio": "divertida.mp3"}, {"tema": "El tiempo", "word": "Hace mucho calor", "audio": "muchocalor.mp3"}, {"tema": "El tiempo", "word": "Llueve", "audio": "llueve.mp3"}, {"tema": "El tiempo", "word": "Nieva", "audio": "nieva.mp3"}, {"tema": "El tiempo", "word": "Está nublado", "audio": "nublado.mp3"}, {"tema": "El tiempo", "word": "Hace frío", "audio": "frio.mp3"}, {"tema": "El clima", "word": "Seco", "audio": "seco.mp3"}, {"tema": "El clima", "word": "Nublado", "audio": "climanublado.mp3"}, {"tema": "El clima", "word": "Semiárido", "audio": "semiarido.mp3"}, {"tema": "El clima", "word": "Frío", "audio": "climafrio.mp3"}, {"tema": "El clima", "word": "Caluroso", "audio": "caluroso.mp3"}, {"tema": "El clima", "word": "Tropical", "audio": "tropical.mp3"}, {"tema": "Las estaciones del año", "word": "El otoño", "audio": "otono.mp3"}, {"tema": "Las estaciones del año", "word": "El invierno", "audio": "invierno.mp3"}, {"tema": "Las estaciones del año", "word": "La primavera", "audio": "primavera.mp3"}, {"tema": "Las estaciones del año", "word": "El verano", "audio": "verano.mp3"}];
        const TOTAL_CARDS = cardData.length;

        let playedLetters = new Set();
        let isPlayingSequence = false;
        let sequenceIndex = 0;

        function loadProgress() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    playedLetters = new Set(data.playedLetters || []);
                    updateProgressDisplay();
                }
            } catch (e) {
                console.error('Error loading progress:', e);
            }
        }

        function saveProgress() {
            try {
                const data = {
                    playedLetters: Array.from(playedLetters),
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.error('Error saving progress:', e);
            }
        }

        function updateProgressDisplay() {
            const played = playedLetters.size;
            document.getElementById('played-count').textContent = played;
            const percent = TOTAL_CARDS > 0 ? Math.round((played / TOTAL_CARDS) * 100) : 0;
            document.getElementById('progress-percent').textContent = percent + '%';
        }

        function playAudio(audioFile) {
            const audioUrl = baseUrl + audioFile;
            const audio = new Audio(audioUrl);
            audio.play().catch(err => console.error('Error playing audio:', err));
        }

        function playAudioAndTrack(index, audioFile) {
            playAudio(audioFile);
            playedLetters.add(index);
            saveProgress();
            updateProgressDisplay();
        }

        function generateTable() {
            const tbody = document.getElementById('alphabet-tbody');
            tbody.innerHTML = '';

            cardData.forEach((card, index) => {
                const row = document.createElement('tr');
                const audioId = index + 1;

                row.innerHTML = `
                    <td style="text-align: center; color: #667eea; font-weight: 700;">
                        ${audioId}
                    </td>
                    <td>
                        <span class="tema-badge">${card.tema}</span>
                    </td>
                    <td>
                        <span class="word-cell">${card.word}</span>
                    </td>
                    <td>
                        <button class="play-button" onclick="playAudioAndTrack(${index}, '${card.audio}')">
                            <i class="fas fa-play"></i> Escuchar
                        </button>
                    </td>
                `;

                tbody.appendChild(row);
            });
        }

        function playAll() {
            if (isPlayingSequence) return;
            isPlayingSequence = true;
            sequenceIndex = 0;

            function playNext() {
                if (sequenceIndex < TOTAL_CARDS) {
                    const card = cardData[sequenceIndex];
                    playAudioAndTrack(sequenceIndex, card.audio);
                    sequenceIndex++;
                    setTimeout(playNext, 1000); // 1 segundo entre audios
                } else {
                    isPlayingSequence = false;
                }
            }

            playNext();
        }

        function pauseAll() {
            isPlayingSequence = false;
            sequenceIndex = 0;
        }

        function resetProgress() {
            if (confirm('¿Reiniciar el progreso? Se perderán todos los datos guardados.')) {
                playedLetters.clear();
                localStorage.removeItem(STORAGE_KEY);
                updateProgressDisplay();
            }
        }

        // Inicializar
        loadProgress();
        generateTable();
    </script>
</body>
</html>
