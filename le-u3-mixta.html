<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap">
    <title>Repaso mixto Léxico U3</title>
    <style>
        /* Estilos básicos */
        body,
        html {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #505255, #00020a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #flashcard-container-wrapper {
            position: relative;
            width: calc(100% - 20px);
            max-width: 600px;
        }

        #flashcard-container {
            width: 100%;
            height: 500px;
            max-height: 500px;
            perspective: 1000px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
            background: linear-gradient(to right, #1f3658, #3558e3);
            border: 3px solid #aab0b4;
            margin: 0;
        }

        .flashcard,
        .results-card {
            width: 100%;
            height: 100%;
            position: absolute;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            -webkit-transition: -webkit-transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 15px;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .flashcard.is-visible {
            display: flex;
        }

        .front,
        .back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            overflow: hidden;
        }

        .card-back {
            -webkit-transform: rotateY(180deg);
            transform: rotateY(180deg);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .front img,
        .back img {
            width: 100%;
            height: 100%;
        }

        .top-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #fff;
            font-size: 1.4em;
            font-weight: 700;
            margin: 0;
            padding: 4px 8px;
            font-family: 'Poppins', sans-serif;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-corner {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-corner img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .top-status-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2px auto 5px auto;
            gap: 2px;
            position: relative;
            z-index: 10;
        }

        .pill {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 1.0em;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            background: #fff;
            min-width: 60px;
            justify-content: center;
            letter-spacing: 0.3px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .pill-faltan {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: #fff;
            box-shadow: 0 2px 6px rgba(255, 107, 53, 0.15);
            gap: 8px;
            border: none;
        }

        .pill-progreso {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: #fff;
            box-shadow: 0 2px 6px rgba(78, 205, 196, 0.15);
            font-weight: 600;
            font-size: 1.0em;
            min-width: 60px;
            text-align: center;
            transition: all 0.3s ease;
            border: none;
            border-radius: 20px;
            display: none;
        }

        .back-arrow {
            background: #ffffff;
            color: #333;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            gap: 8px;
            border: none;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-arrow:hover {
            background-color: #fff;
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .back-arrow i {
            color: #333;
        }

        .back-arrow.menu-btn {
            background: linear-gradient(135deg, #ffcf33 0%, #f39c12 100%);
            color: #0b0d3f;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.35);
            font-weight: 700;
        }

        .back-arrow.menu-btn:hover {
            background: linear-gradient(135deg, #ffd95a 0%, #f1a844 100%);
            color: #0b0d3f;
        }

        /* Welcome Modal */
        .welcome-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        #mode-modal {
            width: 100vw;
            height: 100vh;
            inset: 0;
            z-index: 14000;
        }

        .stay-exposure #mode-modal,
        .stay-cards #mode-modal {
            display: none !important;
        }

        .stay-cards .button.yes,
        .stay-cards .button.no {
            display: inline-flex !important;
        }

        .stay-cards .pill-progreso {
            display: flex !important;
        }

        .welcome-modal.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .welcome-card {
            background: linear-gradient(135deg, #1f3658 0%, #3558e3 100%);
            padding: 28px 22px;
            border-radius: 18px;
            box-shadow: 0 14px 38px rgba(0, 0, 0, 0.3);
            text-align: center;
            transform: scale(1);
            transition: transform 0.3s ease;
            max-width: 470px;
            width: calc(100% - 22px);
            margin: 0 16px;
        }

        .welcome-card h2 {
            color: #fff;
            margin: 0 0 12px 0;
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
        }

        .welcome-card p {
            color: rgba(255, 255, 255, 0.9);
            margin: 8px 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .start-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 2px;
            width: 100%;
        }

        .start-button {
            padding: 10px 12px;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background-color: #3498db;
            color: #fff;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            -webkit-tap-highlight-color: transparent;
            width: 100%;
            max-width: 220px;
            display: inline-flex;
            gap: 8px;
        }

        .start-button#start-button {
            background: #ffd700;
            color: #1f2c4d;
        }

        .start-button#continue-button {
            background: #4ecdc4;
            color: #0f2a3f;
        }

        .start-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
        }

        .start-button:active {
            transform: translateY(0);
            box-shadow: none;
            outline: none !important;
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background-color: #3498db;
            color: #fff;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .button.yes,
        .button.no {
            min-width: 44px;
            height: 42px;
            padding: 10px 12px;
            display: none;
        }

        .button.yes {
            background-color: #27ae60;
            margin-right: 18px;
        }

        .button.no {
            background-color: #e74c3c;
            margin-right: 18px;
        }

        .button:active,
        .button:focus {
            box-shadow: none !important;
            outline: none;
        }

        #reset-button {
            width: 42px;
            height: 42px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 0;
        }

        .button.disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .button:hover:not(.disabled) {
            transform: translateY(-3px);
        }

        .button.yes.pressed {
            background: linear-gradient(135deg, #2ecc71 0%, #1e9f55 100%);
            box-shadow: none;
            transform: scale(0.98);
        }

        .button.no.pressed {
            background: linear-gradient(135deg, #ff6b6b 0%, #c0392b 100%);
            box-shadow: none;
            transform: scale(0.98);
        }

        .counter {
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            background: #f0f2f5;
            color: #333;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 600px) {
            #flashcard-container {
                height: 400px;
            }

            .top-title {
                font-size: 1.1em;
            }

            .welcome-card {
                width: calc(100% - 32px);
            }
        }
    </style>
</head>

<body>
    <div id="mode-modal" class="welcome-modal" style="display:flex;">
        <div class="welcome-card" style="position:relative;">
            <button class="close-modal" id="close-mode-modal" aria-label="Cerrar">×</button>
            <h2>¿Cómo quieres practicar?</h2>
            <div class="start-buttons">
                <button class="start-button" id="btn-review-list"
                    style="background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%); color: #0f2a3f;">Repasar la
                    lista</button>
                <button class="start-button" id="mode-cards-btn">Repasar las tarjetas</button>
            </div>
        </div>
    </div>

    <div class="welcome-modal" id="welcome-modal" style="display:none;">
        <div class="welcome-card">
            <button class="close-modal" id="close-welcome-modal" aria-label="Cerrar">&times;</button>
            <h2>Hay <span class="percentage">40</span> tarjetas listas para practicar</h2>
            <p class="progress-text" id="progress-text"></p>
            <div class="start-buttons">
                <button class="start-button" id="start-button">Empezar</button>
                <button class="start-button" id="continue-button" style="display:none;">Continuar</button>
            </div>
        </div>
    </div>

    <div class="top-title"><div class="logo-corner">
        <img src="https://fawzinoo.github.io/Fotos/f.png" alt="Logo F" draggable="false">
    </div><i class="fas fa-spell-check"></i>Léxico U3 Mixto<i class="fas fa-layer-group"></i></div>

    <div class="top-status-bar">
        <div class="pill back-arrow" onclick="goBackPage()" aria-label="Atrás" title="Atrás">
            <span><i class="fas fa-arrow-left"></i></span>
        </div>
        <div class="pill back-arrow menu-btn" onclick="goBack()" aria-label="Menú" title="Menú">
            <span>Menú</span>
        </div>
        <div class="pill pill-faltan" id="pill-faltan">
            <span>T: <span id="total-cards-cards">40</span></span>
        </div>
        <div class="pill pill-progreso" id="porcentaje-guardado"></div>
    </div>

    <div id="flashcard-container-wrapper">
        <div id="flashcard-container">
            <!-- Flashcards dinámicas -->
        </div>
    </div>

        const shuffleCards = (cards) => {
            const shuffled = [...cards];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        };

        const getRandomCards = (pool, count) => {
            const shuffled = shuffleCards(pool);
            return shuffled.slice(0, count);
        };

        let allCards = [];

            }
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % finalShuffled.length;
            showCard(currentCardIndex);
        }

        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + finalShuffled.length) % finalShuffled.length;
            showCard(currentCardIndex);
        }

        function updateProgress() {
            playedLetters.add(finalShuffled[currentCardIndex].audioFile);
            localStorage.setItem('playedLetters_U3', JSON.stringify([...playedLetters]));
            
            const percentage = Math.round((playedLetters.size / finalShuffled.length) * 100);
            const pill = document.getElementById('porcentaje-guardado');
            pill.textContent = `Visto: ${percentage}%`;
        }

        function goBack() {
            if (confirm('¿Volver al menú?')) {
                localStorage.setItem('currentIndex_U3', '0');
                localStorage.setItem('playedLetters_U3', JSON.stringify([]));
                location.reload();
            }
        }

        function goBackPage() {
            history.back();
        }

        // Inicializar
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('playedLetters_U3');
            if (saved) {
                playedLetters = new Set(JSON.parse(saved));
            }
            
            const savedIndex = localStorage.getItem('currentIndex_U3');
            if (savedIndex) {
                currentCardIndex = parseInt(savedIndex);
            }

            document.getElementById('mode-cards-btn').addEventListener('click', () => {
                document.getElementById('mode-modal').style.display = 'none';
                document.getElementById('welcome-modal').style.display = 'flex';
                document.body.classList.add('stay-cards');
            });

            document.getElementById('start-button').addEventListener('click', () => {
                document.getElementById('welcome-modal').style.display = 'none';
                showCard(0);
            });

            document.getElementById('continue-button').addEventListener('click', () => {
                document.getElementById('welcome-modal').style.display = 'none';
                showCard(currentCardIndex);
            });

            if (playedLetters.size > 0) {
                document.getElementById('continue-button').style.display = 'inline-flex';
            }

            showCard(currentCardIndex);
        });

        // Eventos de navegación
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === ' ') flipCard();
        });

        // Click en tarjeta para voltearse
        document.addEventListener('click', (e) => {
            if (e.target.closest('.flashcard')) {
                flipCard();
            }
        });
    </script>
</body>

</html>
