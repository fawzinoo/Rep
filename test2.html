      if (request.status && (request.status < 200 || request.status >= 300)) {
        throw new Error('No se pudo cargar ' + file);
      }
      return new DOMParser().parseFromString(request.responseText, 'text/html');

        // Conservar las letras necesarias, incluso si la raíz las repite;

        const key = (tile) => String(tile.label || tile.word).toLocaleLowerCase('es');

        // las palabras nominales más largas pasan a sílabas.
        const clean = (value) => String(value || '')

        const normalizedAnswer = clean(answer);
        const topicForms = {
          muymucho: ['muy', 'mucho', 'mucha', 'muchos', 'muchas'],

          cuantos: ['cuánto', 'cuántos', 'cuántas'],
          donde: ['dónde está', 'dónde están']

        const normalizedChoices = [...new Set((topicForms[topic] || choices).map(clean).filter(Boolean))];

            || normalizedAnswer.startsWith(choice + ' ')

            || normalizedAnswer.includes(' ' + choice + ' '))
          .sort((a, b) => b.length - a.length)[0]
          || normalizedAnswer.split(' ')[0] || '';
        const labelFor = (letter, index, list) => list.length === 1 ? letter
          : index === 0 ? letter + '-'
          : index === list.length - 1 ? '-' + letter
          : '-' + letter + '-';
        // La forma evaluada puede contener varias palabras. Los guiones
        // delimitan cada palabra, no toda la frase: en «qué son» la última
        // ficha de «qué» es «-é» y la primera de «son» es «s-».
        const targetTiles = targetForm.split(/\s+/).flatMap((word, wordIndex) => {
          const letters = word.split('');
          return letters.map((letter, index, list) => ({
            word: letter,
            label: labelFor(letter, index, list),
            isTarget: true,
            targetGroup: 'form-' + wordIndex,
            segmentTarget: true,
            targetOrder: wordIndex * 100 + index,
            nominalPart: true
          }));
        });
        // El nombre se conserva por palabras: "las", "playas", "de",
        // "Málaga" son cuatro fichas independientes.
        const formPosition = normalizedAnswer.indexOf(targetForm);
        // El nombre evaluable sale del front, no de la frase completa del back.
        // Así no entran palabras de la pregunta, del contexto o de la respuesta
        // hablada que no aparecen en la tarjeta visible.
        const completeName = clean(visibleName) || (formPosition >= 0
          ? (normalizedAnswer.slice(0, formPosition) + ' ' + normalizedAnswer.slice(formPosition + targetForm.length))
              .replace(/\s+/g, ' ').trim()
          : '');
        const nominalWords = completeName ? completeName.split(/\s+/).filter(Boolean) : [];
        const visibleWords = String(visibleName || '').replace(/[¿?!¡.,:;]/g, '').trim().split(/\s+/);
        const nominalParts = nominalWords.map((word, wordIndex) => ({
          word,
          displayWord: visibleWords[wordIndex] || word,
          label: word,
          isTarget: true,
          targetGroup: 'name-' + wordIndex,
          segmentTarget: true,
          targetOrder: 1000 + wordIndex * 100,
          nominalPart: true
        }));
        const makeSyllables = (word) => {
          const key = word.toLocaleLowerCase('es');
          const wordIndex = nominalWords.indexOf(word);
          const targetGroup = 'name-' + wordIndex;
          const syllables = nounSyllables[key] || [word];
          if (syllables.length === 1) return nominalParts.find((part) => part.word === word)
            ? [nominalParts.find((part) => part.word === word)]
            : [{ word, label: word, isTarget: true, nominalPart: true }];
          return syllables.map((syllable, index) => ({
            word: syllable.replace(/-/g, ''),
            displayWord: visibleWords[wordIndex] || word,
            label: syllables.length === 1 ? syllable
              : index === 0 ? syllable + '-'
              : index === syllables.length - 1 ? '-' + syllable
              : '-' + syllable + '-',
            isTarget: true,
            targetGroup,
            segmentTarget: true,
            targetOrder: 1000 + wordIndex * 100 + index,
            nominalPart: true
          }));
        };
        let nominalTiles = [...nominalParts];
        // La rejilla tiene 16 fichas. Dividir solo lo necesario, empezando
        // por las palabras más largas, para no perder ningún elemento visible.
        const maxTargetTiles = 16;
        const longestFirst = [...nominalWords].sort((a, b) => b.length - a.length);
        for (const word of longestFirst) {
          if (targetTiles.length + nominalTiles.length <= maxTargetTiles) break;
          const replacement = makeSyllables(word);
          nominalTiles = nominalTiles.filter((part) => part.word !== word);
          nominalTiles.push(...replacement);
        }
        targetTiles.push(...nominalTiles);
        const targetLabels = new Set(targetTiles.map((tile) => tile.label));
        const distractors = [];
        const addDistractor = (letter) => {
          const value = String(letter || '').toLocaleLowerCase('es');
          if (!value || /\s/.test(value)) return;
          const label = '-' + value + '-';
          if (targetLabels.has(label) || distractors.some((tile) => tile.label === label)) return;
          distractors.push({ word: value, label, isTarget: false, nominalPart: true });
        };
        // Las demás formas y la variante sin tilde aportan errores reales.
        normalizedChoices.filter((choice) => choice !== targetForm).forEach((choice) => {
          choice.replace(/\s+/g, '').split('').forEach(addDistractor);

        'aeiouáéíóúbcdfghjklmnñpqrstvwxyz'.split('').forEach(addDistractor);
        return window.prepareMixedTiles([...targetTiles, ...distractors]);

          + "                        segment.textContent = isPinned ? letter : '';\n"
          + "                        wordGroup.appendChild(segment);\n"
          + "                    });\n"
          + "                });\n"
          + "            } else {\n"
          + "                const word = groupTiles.map((el) => el.dataset.word).join('');\n"
          + "                const displayWord = groupTiles[0]?.dataset.displayWord || word;\n"
          + "                const segment = document.createElement('span');\n"
          + "                const isComplete = groupTiles.every((el) => el.dataset.isPinned === 'true');\n"
          + "                segment.className = 'formed-segment word-slot' + (isComplete ? ' is-complete' : '');\n"
          + "                segment.textContent = isComplete ? displayWord : '';\n"
          + "                segment.style.width = Math.max(1.5, word.length * 0.57) + 'em';\n"
          + "                wordGroup.appendChild(segment);\n"
          + "            }\n"
          + "            progress.appendChild(wordGroup);\n"
          + "        });\n"
          + "    };\n"
          + "    renderSegmentProgress();\n"
      );
      page = page.replace(
        "            selectedTiles.forEach(el => el.classList.add('tile-correct'));\n            try { vibrar(120); } catch(err) {}\n            playSuccessSound();",
        "            selectedTiles.forEach((el, index) => {\n"
          + "                el.classList.remove('tile-correct');\n"
          + "                el.style.setProperty('--lud-complete-delay', `${index * 120}ms`);\n"
          + "                el.classList.add('tile-completed');\n"
          + "            });\n"
          + "            try { vibrar(120); } catch(err) {}\n"
          + "            // El sonido lud-completed.mp3 ya se reproduce una sola vez\n"
          + "            // al completar el segmento, dentro de celebrateCompletedSegment."
      );
      // Recuperar la secuencia original después del efecto de fichas:
      // esperar dos segundos, reproducir la victoria y mostrar la respuesta.
      page = page.replace(
        "            setTimeout(() => {\n                betweenAttempts = false;\n                canFlip = false;\n                renderMasMenosRevealedAnswer(backElement, correctAnswer);",
        "            setTimeout(() => {\n                playSuccessSound();\n                betweenAttempts = false;\n                canFlip = false;\n                renderMasMenosRevealedAnswer(backElement, correctAnswer);"
      );
      page = page.replace(
        "            }, 1200);\n\n            scheduleStatsBoxUpdate();",
        "            }, 2000);\n\n            scheduleStatsBoxUpdate();"
      );
      // Aplicar la limpieza dentro del panel lúdico; el documento base tiene
      // otros temporizadores que no deben interferir con esta baraja.
      const generatedPanelStart = page.indexOf('function generateMultipleChoiceOptions(');
      if (generatedPanelStart >= 0) {
        let generatedPanel = page.slice(generatedPanelStart);
        generatedPanel = generatedPanel.replace(/\n\s*const tileTimerCleanups = \[\];/g, '');
        generatedPanel = generatedPanel.replace(
          '    let timerInterval = null;\n',
          '    let timerInterval = null;\n'
            + '    const tileTimerCleanups = [];\n'
            + '    window.__ludStopActiveExercise = () => {\n'
            + '        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }\n'
            + '        tileTimerCleanups.forEach((cleanup) => { try { cleanup(); } catch (e) {} });\n'
            + '        try { if (typeof removeFrontTimer === "function") removeFrontTimer(); } catch (e) {}\n'
            + '        try { stopAllAudios(); } catch (e) {}\n'
            + '        try { if (window.__ludTransientAudio) { window.__ludTransientAudio.pause(); window.__ludTransientAudio.currentTime = 0; window.__ludTransientAudio = null; } } catch (e) {}\n'
            + '    };\n'
        );
        page = page.slice(0, generatedPanelStart) + generatedPanel;
      }
      page = page.replace('<span class="tile-text">${tileData.word}</span>',
        '<span class="tile-text${tileData.nominalPart || String(tileData.label || tileData.word).length >= 4 ? " tile-text-long" : ""}${String(tileData.label || tileData.word).length >= 9 ? " tile-text-very-long" : ""}">${tileData.label || tileData.word}</span>');
      // Eliminar límites de la baraja original al asignar los 39 audios.
      localStorage.setItem(KEY + '-draw', JSON.stringify(draw));
      document.open();
      document.write(page);
      document.close();
      document.getElementById('loading')?.remove();
    } catch (error) {
      console.error(error);
      const loading = document.getElementById('loading');
      if (loading) loading.textContent = 'No se pudo cargar el ejercicio. Recarga la página para volver a intentarlo.';
    }
  })();
  </script>
</body>
</html>
